<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>packOpening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="gameHeader">
    <img src="img/Necronomicon_Logo.png" alt="Necronomicon" class="gameTitleLogo">
</div>

<div class="userHeader">
    ログインユーザー: <span id="displayUserName">取得中...</span>
</div>

    <div class="mainVisual">
        <div id="sealedPack" class="sealedPack" onclick="openPack()">
            <div class="magicEffect"></div>
        </div>

        <div id="cardDisplayArea" class="cardDisplayArea hidden">
        <div id="cardContainer" class="cardContainer"></div>
        <div class="buttonGroup">
            <button class="resetButton" onclick="resetGacha()">もう一度引く</button>
            <button class="resetButton" onclick="location.href='library.html'">ライブラリを見る</button>
        </div>
    </div>
</div>

    <script src="scripts/main.js"></script>
</body>
</html>
