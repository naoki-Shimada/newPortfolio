<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/library.css">
</head>
<body>

<div class="gameHeader">
    <img src="img/Necronomicon_Logo.png" alt="Necronomicon" class="gameTitleLogo">
</div>

<div class="userHeader">
    ログインユーザー: <span id="displayUserName">取得中...</span>
</div>
    
<div class="libraryWrapper">
    <h1 class="libraryTitle">Card Collection</h1>

    <div class="albumContainer">
        <div id="libraryGrid" class="libraryGrid">
        </div>
    </div>

    <div class="libraryFooter">
        <button class="backButton" onclick="location.href='packOpening.html'">ガチャに戻る</button>
    </div>
</div>

<div id="cardModal" class="cardModal">
    <div class="modalOverlay" id="modalOverlay"></div>
    <div class="modalContent" id="modalContent"></div>
</div>

<script src="scripts/library.js"></script>
<footer></footer>
