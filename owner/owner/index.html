<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game History Timeline</title>
    <link rel="stylesheet" href="../owner/style/style.css">
        
</head>
<body>
    <div class="container" id="timelineContainer">
        <h1 style="text-align: center; margin-bottom: 50px;">Game Play History</h1>
    </div>

    <script>
        const testData = [
            {
                "Date": "2026-01-07",
                "Title": "ELDEN RING NIGHTREIGN",
                "Score": "深度4達成。(全人口のうち上位7%)",
                "Description": "達成の難しい箇所の解説。高難度向けコンテンツ(深き夜)にてクリア。",
                "ImageURL": ""
            },
            {
                "Date": "20xx/xx/xx",
                "Title": "BackPackBattles",
                "Score": "レンジャーにてマスター達成",
                "Description": "ポイント制ランクマッチ。達成の難しい箇所の解説。",
                "ImageURL": ""
            },
            {
                "Date": "2025/11/xx",
                "Title": "Shadowverse Worlds Beyond",
                "Score": "ロイヤルにてマスター達成",
                "Description": "ポイント制ランクマッチ：ロイヤルにて〇〇達成。",
                "ImageURL": ""
            },
        ];
        
        function renderTimeline(data) {
            const container = document.getElementById('timelineContainer');

            data.forEach((item, index) => {
                const side = index % 2 === 0 ? 'left' : 'right';
                const html = `
                    <div class="timeline-item ${side}" id="item-${index}">
                        <div class="content">
                            <span class="date">${item.Date}</span>
                            <h2 class="title">${item.Title}</h2>
                            <div class="score" style="color: #00d4ff; font-weight: bold;">${item.Score}</div>
                            <p class="description">${item.Description}</p>
                            <img src="${item.ImageURL}" alt="${item.Title}" class="screenshot">
                        </div>
                    </div>        
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            // アニメーション実行:少し遅延させて順番に表示
            setTimeout(() => {
                const items = document.querySelectorAll('.timeline-item');
                items.forEach((el, i) => {
                    setTimeout(() => {
                        el.classList.add('show');
                    }, i * 200);
                });
            }, 100);
        }

        // 実行
        document.addEventListener('DOMContentLoaded', () => {
            renderTimeline(testData);
        });
    </script>
</body>
</html>
