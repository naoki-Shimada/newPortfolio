<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCorrecter</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <audio id="ThemeSong" src="https://s.cdpn.io/108440/star-wars-theme.mp3"></audio>

    <div class="StarWarsIntro">
        <p class="IntroText">昔々遥か彼方の銀河系で....</p>

        <p class="IntroTextFadeOut">StarCorrecter</p>

        <div class="CrawlContainer">
            <div class="CrawlContent" id="Crawl">
                <div class="Title">
                    <p>エピソードⅣ
                    </p>
                    <h1>新たなる希望</h1>
                </div>
                <p>内乱のさなか、反乱軍の宇宙船は、秘密の基地から出撃し、邪悪な銀河帝国に対して初の勝利を収めた。</p>
                <p>戦いの最中、反乱軍の工作員は帝国の究極の兵器である「デス・スター」の設計図を盗み出すことに成功した。</p>
                <p>それは装甲を施された宇宙ステーションであり、惑星一つをまるごと破壊するのに十分な威力を備えていた。</p>
                <p>帝国の非情な追っ手に追われながら、レイア姫は奪った設計図を手に故郷へと急ぐ。それは民を救い、銀河に自由を取り戻すための唯一の希望であった……。</p>
            </div>
        </div>  
    </div>

    <script src="script.js"></script>
</body>
</html>
